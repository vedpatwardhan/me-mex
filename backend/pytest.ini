[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -n 2 --dist=loadgroup -v --tb=short -m "not vllm and not livekit and not slow"
markers =
    vllm: tests requiring live Colab vLLM + LoRA DecisionScorer
    mongodb: tests requiring MongoDB on localhost
    livekit: Phase 2 LiveKit worker + room
    slow: long intra-doc extract against live LLM
    xdist_group: group tests to execute on the same xdist worker process
asyncio_mode = auto