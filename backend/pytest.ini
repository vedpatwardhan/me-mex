[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -n auto --dist=loadgroup -v --tb=short -m "not vllm and not slow"
markers =
    vllm: tests requiring live Colab gateway (vLLM chat + reranker decision/score)
    mongodb: tests requiring MongoDB on localhost
    slow: long intra-doc extract against live LLM
    dock_turn_plane: three-plane voice HTTP/SSE (no LiveKit room)
    live_llm: supervisor/conversation live checks (skip when CHAT_LLM_MODE is not live)
    xdist_group: group tests to execute on the same xdist worker process
asyncio_mode = auto
