[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -n 2 --dist=loadgroup -v --tb=short -m "not vllm and not livekit and not slow and not live_llm"
markers =
    vllm: tests requiring live Colab gateway (vLLM chat + reranker decision/score)
    mongodb: tests requiring MongoDB on localhost
    livekit: Phase 2 LiveKit worker + room
    slow: long intra-doc extract against live LLM
    voice_plane: three-plane voice HTTP/SSE (no LiveKit room)
    live_llm: opt-in tests that query the configured live chat model
    xdist_group: group tests to execute on the same xdist worker process
asyncio_mode = auto
