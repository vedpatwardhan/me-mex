[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -n 2 --dist=loadgroup -v --tb=short
markers =
    vllm: tests requiring the live remote vLLM server
    xdist_group: group tests to execute on the same xdist worker process
asyncio_mode = auto
