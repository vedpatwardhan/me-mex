# Install: ./scripts/install-git-hooks.sh  (or: uv sync --group dev && uv run pre-commit install)
# Run on all files: uv run pre-commit run --all-files

default_install_hook_types: [pre-commit]

exclude: |
  (?x)^(
    \.venv/|
    backend/\.venv/|
    backend/logs/|
    backend/data/decision_training/.*\.jsonl|
    uv\.lock
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (staged Python)
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv run ruff format "$@"' --
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff check --fix (staged Python)
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv run ruff check --fix "$@"' --
        language: system
        types: [python]
        pass_filenames: true
