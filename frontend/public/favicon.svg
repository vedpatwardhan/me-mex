<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="memex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield / Hexagon Outer Frame -->
  <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5" fill="#161b22" stroke="url(#memex-grad)" stroke-width="4" rx="6" />

  <!-- Inner Graph Edges -->
  <g stroke="url(#memex-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="28" x2="28" y2="52" />
    <line x1="50" y1="28" x2="72" y2="52" />
    <line x1="28" y1="52" x2="40" y2="75" />
    <line x1="72" y1="52" x2="60" y2="75" />
    <line x1="28" y1="52" x2="72" y2="52" stroke-dasharray="4 3" opacity="0.6" />
    <line x1="40" y1="75" x2="60" y2="75" />
  </g>

  <!-- Graph Nodes -->
  <!-- Top Central Node (Paper / Source) -->
  <circle cx="50" cy="28" r="7" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- Left Node (Human Insight) -->
  <circle cx="28" cy="52" r="6" fill="#fbbf24" filter="url(#glow)" />
  
  <!-- Right Node (Agent Hypothesis) -->
  <circle cx="72" cy="52" r="6" fill="#c084fc" filter="url(#glow)" />

  <!-- Bottom Left Node (Concept) -->
  <circle cx="40" cy="75" r="5" fill="#2dd4bf" />

  <!-- Bottom Right Node (Concept) -->
  <circle cx="60" cy="75" r="5" fill="#34d399" />
</svg>
